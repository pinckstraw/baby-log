<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#850E35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>育兒日誌</title>
<style>
:root{
  --cream:#FCF5EE; --pink:#FFC4C4; --rose:#EE6983; --wine:#850E35;
  --ink:#3A2027; --mute:#9A8189; --line:#F0E3DA; --card:#fff;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","Microsoft JhengHei UI",
    "PingFang TC","Noto Sans TC","Heiti TC",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-family:inherit;font-weight:700;letter-spacing:.02em}
.hide{display:none!important}

/* ---------- shell ---------- */
#top{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:linear-gradient(180deg,var(--wine),#6d0b2c);
  color:#fff;box-shadow:0 2px 14px rgba(133,14,53,.22);
}
.topRow{display:flex;align-items:center;gap:7px}
.kidBtn{
  display:flex;align-items:center;gap:9px;flex:1;min-width:0;
  background:rgba(255,255,255,.13);border-radius:999px;padding:6px 12px 6px 6px;
}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pink);color:var(--wine);
  display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.kidName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kidAge{font-size:11px;opacity:.75;margin-top:-2px}
.chev{opacity:.7;font-size:12px;flex:none}
mark{background:#FFE08A;color:var(--ink);border-radius:3px;padding:0 1px}
.iconBtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.13);
  display:grid;place-items:center;color:#fff;flex:none}
#syncDot{width:8px;height:8px;border-radius:50%;background:#7ddf9a}
#syncDot.busy{background:#ffd166;animation:pulse 1s infinite}
#syncDot.err{background:#ff8f8f}
@keyframes pulse{50%{opacity:.3}}

#main{padding:calc(var(--safe-t) + 78px) 14px calc(var(--safe-b) + 168px)}

#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
#tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--mute);font-size:10.5px;font-weight:500}
#tabs button.on{color:var(--wine);font-weight:700}
#tabs svg{width:22px;height:22px;stroke-width:1.8}
#fab{
  position:fixed;right:16px;bottom:calc(var(--safe-b) + 70px);z-index:41;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(140deg,var(--rose),var(--wine));color:#fff;
  display:grid;place-items:center;font-size:30px;font-weight:300;
  box-shadow:0 8px 22px rgba(133,14,53,.4);
}
#fab:active{transform:scale(.93)}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;
  box-shadow:0 2px 10px rgba(133,14,53,.05);min-width:0;overflow:hidden}
.secTitle{font-size:12px;font-weight:700;color:var(--wine);letter-spacing:.14em;
  margin:20px 2px 9px;text-transform:uppercase}
.secTitle:first-child{margin-top:2px}
.muted{color:var(--mute)}
.empty{text-align:center;padding:34px 16px;color:var(--mute);font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}
.pillRow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.pillRow::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;
  font-size:13px;white-space:nowrap;color:var(--ink);font-weight:500}
.pill.on{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700}
.btn{background:var(--wine);color:#fff;border-radius:14px;padding:13px;width:100%;
  font-size:16px;font-weight:700;display:block}
.btn.ghost{background:#fff;color:var(--wine);border:1.5px solid var(--pink)}
.btn:active{opacity:.85}
.tag{display:inline-block;background:var(--cream);color:var(--wine);border-radius:8px;
  padding:2px 8px;font-size:11.5px;font-weight:700}

/* ---------- today ---------- */
.nurseNow{background:linear-gradient(135deg,#EE6983,#850E35);color:#fff;
  border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.nurseNow .t{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.nurseTotal{font-size:44px;font-weight:900;color:var(--wine);text-align:center;
  font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.nurseState{text-align:center;font-size:13px;color:var(--mute);margin:4px 0 14px}
.nurseRow{display:flex;gap:10px;margin-bottom:10px}
.nurseSide{flex:1;background:#fff;border:2px solid var(--line);border-radius:18px;
  padding:18px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nurseSide .lb{font-size:20px;font-weight:900;color:var(--ink)}
.nurseSide .tm{font-size:15px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.nurseSide.on{background:var(--rose);border-color:var(--rose)}
.nurseSide.on .lb,.nurseSide.on .tm{color:#fff}
.nurseSide:active{transform:scale(.97)}

.careCard{display:flex;align-items:center;gap:11px;background:#fff;border-radius:16px;
  padding:12px 14px;margin-bottom:10px;border-left:4px solid #4F7FBF;
  box-shadow:0 2px 10px rgba(133,14,53,.06)}
.careCard.vac{border-left-color:#8A6FBF}
.careCard.poop{border-left-color:#A9784B}
.careCard.poop .ttl{color:#8A5F35}
.careCard.late{border-left-color:#D2523F;background:#FFF4F2}
.careCard .ic{font-size:22px;flex:none}
.careCard .ttl{font-weight:800;font-size:14.5px;color:#2F5C91}
.careCard.vac .ttl{color:#5E44A0}
.careCard.late .ttl{color:#B03A2A}
.careCard .sub{font-size:12.5px;color:var(--mute);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.careBtn{flex:none;background:#4F7FBF;color:#fff;border-radius:11px;
  padding:9px 14px;font-size:13px;font-weight:700}
.careCard.late .careBtn{background:#D2523F}

.quickGrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.quick{background:#fff;border-radius:16px;padding:11px 4px 9px;text-align:center;
  box-shadow:0 2px 8px rgba(133,14,53,.05);flex:1 1 0}
.quick .em{font-size:21px;display:block}
.quick .lb{font-size:11px;font-weight:600;margin-top:4px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick:active{background:var(--cream)}
.sleepNow{background:linear-gradient(135deg,var(--rose),var(--wine));color:#fff;
  border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.sleepNow .t{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.wakeBtn{background:#fff;color:var(--wine);border-radius:12px;padding:10px 15px;font-weight:800;font-size:14px;flex:none}

.dayStats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.st{background:#fff;border-radius:14px;padding:7px 5px 9px;text-align:center;
  box-shadow:0 2px 8px rgba(133,14,53,.05);flex:1 1 0;min-width:0}
.st .ic{font-size:14px;line-height:1.3}
.st .v{font-size:17px;font-weight:900;color:var(--wine);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.st .l{font-size:10.5px;color:var(--mute);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tl{position:relative;padding-left:32px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:9px}
.ev .dot{position:absolute;left:-32px;top:12px;width:24px;height:24px;border-radius:50%;
  background:#fff;border:2px solid var(--pink);display:grid;place-items:center;font-size:12px}
.ev .body{background:#fff;border-radius:15px;padding:12px 14px;box-shadow:0 2px 8px rgba(133,14,53,.05)}
.ev .hd{display:flex;align-items:center;gap:9px}
.ev .tm{font-size:15px;font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums;flex:none}
.ev .ttl{font-weight:800;font-size:16px;display:flex;align-items:center;gap:5px;color:var(--wine)}
.ev .tem{font-size:19px;line-height:1}
.ev .sub{font-size:15.5px;color:var(--wine);margin-top:5px;font-weight:600;line-height:1.4}
.ev .note{font-size:14px;color:#AA5672;margin-top:4px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.ev .who{font-size:11.5px;color:var(--wine);margin-left:auto;flex:none;
  background:var(--cream);border-radius:7px;padding:2px 7px;font-weight:600;opacity:.75}
.ev img.thumb{width:100%;max-height:210px;object-fit:cover;border-radius:11px;margin-top:8px;background:var(--cream)}
.daySwipe{transition:transform .18s ease-out,opacity .18s ease-out;
  min-height:62vh;touch-action:pan-y}
.dateNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dateNav .d{font-weight:700;font-size:21px;color:#D6486A;letter-spacing:.01em}
.dateNav .d small{display:block;font-size:11.5px;font-weight:600;color:var(--rose);
  letter-spacing:.12em;margin-top:1px}
.dateNav button{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--rose);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(133,14,53,.06);font-size:19px}

/* ---------- sheet / modal ---------- */
.mask{position:fixed;inset:0;background:rgba(58,32,39,.45);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--cream);
  border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1)}
.sheet.on{transform:translateY(0)}
.sheetHd{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);flex:none}
.sheetHd h2{font-size:17px;flex:1}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheetBd{padding:14px 16px calc(var(--safe-b) + 20px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--mute);display:grid;
  place-items:center;font-size:16px;flex:none}

.f{margin-bottom:13px}
.f>label{display:block;font-size:12.5px;font-weight:700;color:var(--wine);margin-bottom:6px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;
  padding:12px 13px;outline:none}
.in:focus{border-color:var(--rose)}
textarea.in{min-height:46px;resize:none;line-height:1.5;overflow:hidden}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;
  font-size:14px;font-weight:600}
.seg button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.photoBox{border:1.5px dashed var(--pink);border-radius:14px;padding:16px;text-align:center;
  color:var(--rose);font-weight:600;font-size:14px;background:#fff}
.photoPrev{position:relative;margin-top:8px}
.photoPrev img{width:100%;border-radius:13px;display:block}
.photoPrev button{position:absolute;top:8px;right:8px;background:rgba(58,32,39,.7);color:#fff;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.typeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.typeGrid button{background:#fff;border-radius:17px;padding:15px 6px;box-shadow:0 2px 8px rgba(133,14,53,.05)}
.typeGrid .em{font-size:26px;display:block}
.typeGrid .lb{font-size:12.5px;font-weight:700;margin-top:6px}

/* ---------- growth ---------- */
.pctBig{font-size:40px;font-weight:900;color:var(--wine);line-height:1;font-variant-numeric:tabular-nums}
.pctBig small{font-size:16px;font-weight:700}
.gRow{display:flex;align-items:center;gap:12px}
.gRow .lft{flex:none;min-width:96px}
.bandNote{font-size:11.5px;color:var(--mute);margin-top:6px;line-height:1.45}
svg.chart{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* ---------- vaccine ---------- */
.vac{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.vac:last-child{border-bottom:0}
.vac .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--pink);flex:none;
  display:grid;place-items:center;color:#fff;font-size:13px;margin-top:1px}
.vac .chk.done{background:var(--rose);border-color:var(--rose)}
.vac .nm{font-weight:700;font-size:14.5px}
.vac .mt{font-size:12px;color:var(--mute);margin-top:2px}
.vac.due .nm{color:var(--wine)}
.badge{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:6px}
.badge.due{background:#FFE3E8;color:var(--wine)}
.badge.soon{background:#FFF3E0;color:#B26A00}
.badge.self{background:#EEF2FF;color:#4256B2}

/* ---------- stats ---------- */


/* ---------- handoff ---------- */
.msg{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(133,14,53,.05)}
.msg.reply{margin-left:24px;border-left:3px solid var(--pink)}
.msg .quote{background:var(--cream);border-radius:10px;padding:7px 10px;margin-bottom:7px;
  font-size:12px;color:var(--mute);border-left:3px solid var(--pink)}
.msg .quote b{color:var(--wine);font-weight:700}
.msg .acts{display:flex;gap:14px;margin-top:8px}
.msg .acts button{font-size:12px;color:var(--mute);font-weight:600}
.msg .acts button.rep{color:var(--rose)}
.replyBar{display:flex;align-items:center;gap:10px;background:var(--cream);
  border-radius:12px;padding:9px 11px;margin-bottom:9px;border-left:3px solid var(--rose)}
.replyBar .txt{flex:1;min-width:0;font-size:12.5px;color:var(--mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replyBar .txt b{color:var(--wine)}
.replyBar button{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--mute);
  display:grid;place-items:center;flex:none}
#tabs button{position:relative}
.badge-dot{position:absolute;top:2px;right:50%;transform:translateX(20px);
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#E0245E;color:#fff;
  font-size:10.5px;font-weight:800;line-height:17px;text-align:center;
  box-shadow:0 1px 4px rgba(224,36,94,.45)}
.msg .mh{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-bottom:5px}
.msg .mb{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.msg.mine{background:#FFF1F3}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translate(-50%,20px);
  background:var(--wine);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;
  font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lightbox{position:fixed;inset:0;background:rgba(30,12,18,.94);z-index:95;display:none;
  align-items:center;justify-content:center;padding:16px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:88vh;border-radius:12px}

/* ---------- setup ---------- */
#setup{position:fixed;inset:0;background:var(--cream);z-index:80;overflow-y:auto;
  padding:calc(var(--safe-t) + 40px) 20px calc(var(--safe-b) + 40px);display:none}
#setup.on{display:block}
#setup .logo{font-size:44px;text-align:center}
#setup h1{text-align:center;color:var(--wine);margin:8px 0 6px;font-size:24px}
#setup p.lead{text-align:center;color:var(--mute);font-size:13.5px;margin:0 0 22px}
</style>
</head>
<body>

<!-- 首次設定 -->
<div id="setup">
  <div class="logo">🍼</div>
  <h1>育兒日誌</h1>
  <p class="lead">貼上你的網頁應用程式網址與通關密語，<br>爸爸、媽媽、保母都填同一組就會同步。</p>
  <div class="f"><label>網頁應用程式網址（.../exec）</label>
    <input class="in" id="suUrl" placeholder="https://script.google.com/macros/s/..../exec" inputmode="url"></div>
  <div class="f"><label>通關密語</label>
    <input class="in" id="suSecret" placeholder="你在 Code.gs 設定的那組"></div>
  <div class="f"><label>你是誰（會顯示在每筆紀錄上）</label>
    <input class="in" id="suWho" placeholder="例如：媽媽、爸爸、陳阿姨"></div>
  <button class="btn" id="suGo">連線</button>
  <p id="suMsg" style="text-align:center;font-size:13px;color:var(--rose);margin-top:14px"></p>
</div>

<!-- 頂列 -->
<div id="top" class="hide">
  <div class="topRow">
    <button class="kidBtn" id="kidBtn">
      <span class="avatar" id="kidAv">—</span>
      <span style="min-width:0">
        <div class="kidName" id="kidNm">尚未新增寶寶</div>
        <div class="kidAge" id="kidAg">點這裡新增</div>
      </span>
      <span class="chev">▼</span>
    </button>
    <button class="iconBtn" id="searchBtn" title="搜尋">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" style="width:18px;height:18px">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconBtn" id="syncBtn" title="同步"><span id="syncDot"></span></button>
    <button class="iconBtn" id="menuBtn">⋯</button>
  </div>
</div>

<div id="main" class="hide"></div>

<button id="fab" class="hide">＋</button>

<nav id="tabs" class="hide">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>今日</button>
  <button data-tab="growth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 18l5-6 4 3 6-8"/><path d="M3 21h18"/></svg>成長</button>
  <button data-tab="vaccine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 3l3 3M16 5l3 3-8 8H8v-3z"/><path d="M4 20h6"/></svg>保健</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>統計</button>
  <button data-tab="handoff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg>交接</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div><div class="grab"></div>
    <div class="sheetHd"><h2 id="sheetTitle">　</h2><button class="x" id="sheetX">✕</button></div>
  </div>
  <div class="sheetBd" id="sheetBd"></div>
</div>

<div id="toast"></div>
<div id="lightbox"><img id="lbImg" alt=""></div>

<script>
"use strict";

/* ============================================================
   0. 常數
   ============================================================ */
var TYPES = {
  sleep:   {em:'🌙', lb:'睡眠',   color:'#7C6BB0'},
  feed:    {em:'🍼', lb:'餵奶',   color:'#EE6983'},

function $(s,r){return (r||document).querySelector(s);}
function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function pad(n){return n<10?'0'+n:''+n;}
function uuid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(m){var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2200);}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function hhmm(iso){var d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes());}
function localInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function dur(ms){
  if(ms==null||isNaN(ms))return '';
  var m=Math.max(0,Math.round(ms/60000)), h=Math.floor(m/60);
  return h>0 ? h+' 小時 '+(m%60)+' 分' : m+' 分';
}
function durShort(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+':'+pad(m%60);}
function ageText(birth){
  if(!birth) return '';
  var b=new Date(birth), n=new Date();
  var mo=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate()) mo--;
  var anchor=new Date(b.getFullYear(),b.getMonth()+mo,b.getDate());
  var days=Math.floor((n-anchor)/86400000);
  if(mo<1) return Math.floor((n-b)/86400000)+' 天';
  if(mo<24) return mo+' 個月 '+days+' 天';
  return Math.floor(mo/12)+' 歲 '+(mo%12)+' 個月';
}
function ageMonths(birth,at){
  var b=new Date(birth), n=at?new Date(at):new Date();
  return (n-b)/86400000/30.4375;
}
function normCdf(z){
  var t=1/(1+0.2316419*Math.abs(z));
  var d=0.3989423*Math.exp(-z*z/2);
  var p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
function interpRow(tbl,m){
  if(m<=tbl[0][0]) return tbl[0].slice(1);
  if(m>=tbl[tbl.length-1][0]) return tbl[tbl.length-1].slice(1);
  for(var i=1;i<tbl.length;i++){
    if(m<=tbl[i][0]){
      var a=tbl[i-1],b=tbl[i],f=(m-a[0])/(b[0]-a[0]);
      return [1,2,3,4,5].map(function(k){return a[k]+(b[k]-a[k])*f;});
    }
  }
  return tbl[tbl.length-1].slice(1);
}
function percentile(sex,metric,months,value){
  var tbl=(GROWTH[sex]||GROWTH.boy)[metric]; if(!tbl||!value) return null;
  var r=interpRow(tbl,months), z;
  if(value<=r[0]) z=PCTZ[0]-(r[0]-value)/Math.max(.001,(r[1]-r[0]))*(PCTZ[1]-PCTZ[0]);
  else if(value>=r[4]) z=PCTZ[4]+(value-r[4])/Math.max(.001,(r[4]-r[3]))*(PCTZ[4]-PCTZ[3]);
  else{
    for(var i=1;i<5;i++){ if(value<=r[i]){ z=PCTZ[i-1]+(value-r[i-1])/(r[i]-r[i-1])*(PCTZ[i]-PCTZ[i-1]); break; } }
  }
  var p=normCdf(z)*100;
  return Math.max(0.1,Math.min(99.9,p));
}

var CFG = {
  url: localStorage.getItem('bl_url')||'',
  secret: localStorage.getItem('bl_secret')||'',
  who: localStorage.getItem('bl_who')||''
};
function api(payload){
  payload.secret = CFG.secret;
  return fetch(CFG.url,{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  }).then(function(r){
    return r.text().then(function(txt){
      var j;
      try{ j=JSON.parse(txt); }
      catch(e){
        /* 回傳的不是 JSON，通常是 Google 的登入頁或錯誤頁 */
        if(/accounts\.google\.com|使用者登入|Sign in/i.test(txt))
          throw new Error('Google 要求登入。請確認部署設定的「具有存取權的使用者」是「所有人」');
        if(/Script function not found|找不到指令碼函式/i.test(txt))
          throw new Error('找不到程式函式，請重新部署一次 Apps Script');
        if(/Exception|TypeError|ReferenceError/i.test(txt))
          throw new Error('Apps Script 執行錯誤，請到 Apps Script 的「執行項目」看詳細訊息');
        if(r.status>=500) throw new Error('Google 伺服器忙碌（'+r.status+'），稍後會自動重試');
        throw new Error('伺服器回應不是資料格式（HTTP '+r.status+'）');
      }
      if(!j.ok) throw new Error(j.error||'伺服器錯誤');
      return j;
    });
  });
}

var photoCache={};
function photoUrl(id,imgEl){
  if(!id) return;
  var c=photoCache[id]||localStorage.getItem('bl_ph_'+id);
  if(c){ imgEl.src=c; return; }
  api({action:'getPhoto',id:id}).then(function(j){
    var url='data:'+j.mime+';base64,'+j.base64;
    photoCache[id]=url;
    try{localStorage.setItem('bl_ph_'+id,url);}catch(e){}
    imgEl.src=url;
  }).catch(function(){});
}

function kid(){ return S.children.filter(function(c){return c.id===S.kid;})[0] || S.children[0]; }
function kidRecords(){
  var k=kid(); if(!k) return [];
  return S.records.filter(function(r){return r.childId===k.id;})
    .sort(function(a,b){return new Date(b.startAt)-new Date(a.startAt);});
}
function parseData(r){ try{ return r.data?JSON.parse(r.data):{}; }catch(e){ return {}; } }

function setSync(state){
  var d=$('#syncDot'); d.className=state||'';
}
function pull(silent,retry){
  setSync('busy');
  return api({action:'getAll'}).then(function(j){
    S.children=alive(j.children); S.records=alive(j.records); S.handoff=alive(j.handoff);
    if(!S.kid || !kid()) S.kid=(S.children[0]||{}).id||'';
    S.loaded=true; setSync(''); render();
  }).catch(function(e){
    if(!retry && /忙碌|不是資料格式|Failed to fetch|NetworkError|Load failed/i.test(e.message)){
      return new Promise(function(res){ setTimeout(res,2500); }).then(function(){
        return pull(silent,true);
      });
    }
    setSync('err'); if(!silent) toast('同步失敗：'+e.message);
  });
}
function push(sheet,item){
  setSync('busy');
  var act = sheet==='records'?'saveRecord':sheet==='children'?'saveChild':'saveHandoff';
  return api({action:act,item:item}).then(function(j){
    setSync(''); return j.item;
  }).catch(function(e){ setSync('err'); toast('儲存失敗：'+e.message); throw e; });
}
function removeItem(sheet,id){
  setSync('busy');
  return api({action:'delete',sheet:sheet,id:id}).then(function(){setSync('');})
    .catch(function(e){setSync('err');toast('刪除失敗：'+e.message);throw e;});
}

/* 照片：壓縮後上傳 */
function compress(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, w=img.width, h=img.height;
      if(Math.max(w,h)>max){ var s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      var cv=el('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function photoField(state){
  var wrap=el('div','f');
  wrap.appendChild(el('label',null,'照片（可直接拍照）'));
  var box=el('button','photoBox','📷　拍照或選擇照片');
  box.type='button';
  var inp=el('input'); inp.type='file'; inp.accept='image/*'; inp.className='hide';
  var prev=el('div','photoPrev hide');
  var img=el('img'); var rm=el('button',null,'✕'); rm.type='button';
  prev.appendChild(img); prev.appendChild(rm);
  rm.onclick=function(){ state.dataUrl=null; state.photoId=null; prev.classList.add('hide'); box.classList.remove('hide'); };
  box.onclick=function(){ inp.click(); };
  inp.onchange=function(){
    if(!inp.files[0])return;
    compress(inp.files[0],function(url){
      state.dataUrl=url; img.src=url; prev.classList.remove('hide'); box.classList.add('hide');
    });
  };
  if(state.photoId){ prev.classList.remove('hide'); box.classList.add('hide'); photoUrl(state.photoId,img); }
  wrap.appendChild(box); wrap.appendChild(inp); wrap.appendChild(prev);
  return wrap;
}
function uploadIfNeeded(state){
  if(!state.dataUrl) return Promise.resolve(state.photoId||'');
  var parts=state.dataUrl.split(',');
  var mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  return api({action:'addPhoto',base64:parts[1],mime:mime,name:'log-'+Date.now()+'.jpg'})
    .then(function(j){ return j.photoId; });
}

/* 常用詞快速選單：把過去輸入過的內容拆成詞，最近 10 個做成可點選的按鈕 */
function recentTokens(pick){
  var seen={}, out=[];
  S.records.slice()
    .sort(function(a,b){return new Date(b.startAt)-new Date(a.startAt);})
    .forEach(function(r){
      var txt=pick(r);
      if(!txt) return;
      String(txt).split(/\s+/).forEach(function(t){
        t=t.trim();
        if(!t || seen[t] || out.length>=10) return;
        seen[t]=1; out.push(t);
      });
    });
  return out;
}
/* 把常用詞按鈕接到任何一個輸入框上（點一下加入、再點一下移除，以空白隔開） */
function attachTokens(inputEl,tokens,onChange){
  if(!tokens.length) return null;
  var chips=el('div','pillRow');
  chips.style.marginBottom='7px';
  function words(){ return (inputEl.value||'').split(/\s+/).filter(Boolean); }
  function sync(){
    var w=words();
    chips.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('on', w.indexOf(b.dataset.t)>=0);
    });
  }
  tokens.forEach(function(t){
    var b=el('button','pill',esc(t));
    b.type='button'; b.dataset.t=t;
    b.onclick=function(){
      var w=words(), i=w.indexOf(t);
      if(i>=0) w.splice(i,1); else w.push(t);
      inputEl.value=w.join(' ');
      if(onChange) onChange(inputEl.value);
      sync();
    };
    chips.appendChild(b);
  });
  var prev=inputEl.oninput;
  inputEl.oninput=function(e){ if(prev) prev(e); sync(); };
  chips._sync=sync;
  setTimeout(sync,0);
  return chips;
}
/* 備註輸入框：預設一行，內容變多才自己長高 */
function autoGrow(ta){
  function fit(){
    ta.style.height='auto';
    ta.style.height=Math.min(200,Math.max(46,ta.scrollHeight))+'px';
  }
  var prev=ta.oninput;
  ta.oninput=function(e){ if(prev) prev(e); fit(); };
  setTimeout(fit,0);
  return ta;
}
function noteField(type,model){
  var wrap=el('div','f');
  wrap.appendChild(el('label',null,'備註'));
  var ta=el('textarea','in');
  ta.rows=1;
  ta.value=model.note||'';
  ta.placeholder='想補充的都寫這裡';
  ta.oninput=function(){ model.note=ta.value; };
  var tokens=recentTokens(function(r){ return r.type===type ? r.note : ''; });
  var chips=attachTokens(ta,tokens,function(v){ model.note=v; autoGrowFit(ta); });
  if(chips) wrap.appendChild(chips);
  wrap.appendChild(ta);
  autoGrow(ta);
  return wrap;
}
function autoGrowFit(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(200,Math.max(46,ta.scrollHeight))+'px';
}

function exportCsv(){

/* ============================================================
   7. 事件摘要文字
   ============================================================ */
function summary(r){
  var d=parseData(r);
  switch(r.type){
    case 'sleep': return r.endAt ? '睡了 '+dur(new Date(r.endAt)-new Date(r.startAt))+'（'+hhmm(r.startAt)+'–'+hhmm(r.endAt)+'）' : '睡眠中…';
    case 'feed': {
      if(d.L!=null || d.R!=null){
        var seg=[];
        if(d.L) seg.push('左 '+d.L+' 分');
        if(d.R) seg.push('右 '+d.R+' 分');
        var f=d.first==='L'?'從左開始':d.first==='R'?'從右開始':'';
        return '親餵　'+seg.join('・')+(f?'（'+f+'）':'')+'　共 '+(d.amount||0)+' 分';
      }
      return (d.method||'')+(d.amount?' '+d.amount+(d.method==='親餵'?' 分鐘':' ml'):'');
    }
    case 'solid': return (d.food||'副食品')+(d.accept?'・'+d.accept:'');
    case 'poop': return [d.texture,d.color?d.color+'色':'',d.amount?'量'+d.amount:''].filter(Boolean).join('・');
    case 'med': return d.name ? (d.name+(d.dose?' '+d.dose:'')+(d.reason?'（'+d.reason+'）':'')) : '';
    case 'temp': return (d.value||'')+' °C'+(d.spot?'・'+d.spot:'');
    case 'growth': return [d.height?'身高 '+d.height+' cm':'',d.weight?'體重 '+d.weight+' kg':'',d.head?'頭圍 '+d.head+' cm':''].filter(Boolean).join('・');
    case 'dental': return [d.item,d.clinic,d.next?'下次 '+d.next:''].filter(Boolean).join('・');
    case 'vaccine': return (d.name?vacName(d.name):'疫苗')+(d.place?'・'+d.place:'');
  }
  return '';
}

var NURSE=null;
function nurseLoad(){
  try{ NURSE=JSON.parse(localStorage.getItem('bl_nurse')||'null'); }catch(e){ NURSE=null; }
  return NURSE;
}
function nurseSave(){
  if(NURSE) localStorage.setItem('bl_nurse',JSON.stringify(NURSE));
  else localStorage.removeItem('bl_nurse');
}
function nurseClear(){ NURSE=null; nurseSave(); }
/* 目前各邊累積毫秒（含正在計時的那一段） */
function nurseTotals(){
  if(!NURSE) return {L:0,R:0,total:0};
  var L=NURSE.L||0, R=NURSE.R||0;
  if(NURSE.side && NURSE.since){
    var run=Date.now()-NURSE.since;
    if(NURSE.side==='L') L+=run; else R+=run;
  }
  return {L:L,R:R,total:L+R};
}
/* 按下某一邊：沒在計時就開始、同一邊再按停止、按另一邊就換邊 */
function nurseTap(side){
  if(!NURSE) NURSE={startedAt:new Date().toISOString(),L:0,R:0,side:null,since:null,first:side};
  if(!NURSE.first) NURSE.first=side;
  if(NURSE.side===side){                       /* 停止 */
    var run=Date.now()-NURSE.since;
    NURSE[side]=(NURSE[side]||0)+run;
    NURSE.side=null; NURSE.since=null;
  }else{
    if(NURSE.side){                            /* 換邊：先結算目前這邊 */
      var r2=Date.now()-NURSE.since;
      NURSE[NURSE.side]=(NURSE[NURSE.side]||0)+r2;
    }
    NURSE.side=side; NURSE.since=Date.now();
  }
  nurseSave();
}

function haystack(r){
  var d=parseData(r), parts=[];
  parts.push(TYPES[r.type]?TYPES[r.type].lb:r.type);
  parts.push(r.note||'');
  parts.push(r.by||'');
  ['food','accept','method','texture','color','amount','name','dose','reason',
   'value','spot','height','weight','head','place','item','clinic','next'].forEach(function(k){
    if(d[k]!=null && d[k]!=='') parts.push(String(d[k]));
  });
  parts.push(summary(r));
  return parts.join(' ').toLowerCase();
}
function hl(text,q){
  var t=esc(text||'');
  if(!q) return t;
  var i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length);
}
function snippet(text,q,len){
  text=String(text||'');
  if(!q) return text.slice(0,len||60);
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return text.slice(0,len||60);
  var s=Math.max(0,i-18);
  return (s>0?'…':'')+text.slice(s,s+(len||60));
}

/* ============================================================
   8. 今日
   ============================================================ */
function ongoingSleep(){
  return kidRecords().filter(function(r){return r.type==='sleep' && !r.endAt;})[0];
}
function recordsOn(day){
  return kidRecords().filter(function(r){return dkey(new Date(r.startAt))===day;})
    .sort(function(a,b){return new Date(a.startAt)-new Date(b.startAt);});
}
/* 依項目數決定每列幾格，讓每一列都填滿，不會留空格 */
function fitRows(container,n){
  var per = n<=4 ? n : (n<=6 ? 3 : 4);
  var basis = 'calc('+(100/per)+'% - '+((per-1)*8/per).toFixed(2)+'px)';
  Array.prototype.forEach.call(container.children,function(c){
    c.style.flexBasis=basis;
  });
  return per;
}

function agoShort(ms){
  if(ms==null) return '—';
  var m=Math.round(ms/60000);
  if(m<60) return m+'分';
  var h=Math.floor(m/60);
  if(h<24) return h+'時'+pad(m%60);
  var d=Math.floor(h/24);
  return d+'天'+(h%24)+'時';
}
function todaySleepMs(){
  var ms=0, d0=new Date(); d0.setHours(0,0,0,0);
  var d1=new Date(d0.getTime()+86400000);
  kidRecords().forEach(function(r){
    if(r.type!=='sleep')return;
    var s=new Date(r.startAt), e=r.endAt?new Date(r.endAt):new Date();
    var a=Math.max(s,d0), b=Math.min(e,d1);
    if(b>a) ms+=b-a;
  });
  return ms;
}
function lastOf(type){
  return kidRecords().filter(function(r){return r.type===type;})[0];
}
function statValue(key){
  var today=recordsOn(dkey(new Date()));
  var of=function(t){ return today.filter(function(r){return r.type===t;}); };
  switch(key){
    case 'sleepToday': return (todaySleepMs()/3600000).toFixed(1)+'h';
    case 'naps': return of('sleep').length;
    case 'awake': {
      if(ongoingSleep()) return '睡眠中';
      var ended=kidRecords().filter(function(r){return r.type==='sleep'&&r.endAt;});
      if(!ended.length) return '—';
      var last=ended.reduce(function(a,b){
        return new Date(b.endAt)>new Date(a.endAt)?b:a;
      });
      return agoShort(Date.now()-new Date(last.endAt));
    }
    case 'feedCount': return of('feed').length;
    case 'feedMl': {
      var ml=of('feed').reduce(function(a,r){var d=parseData(r);
        return a+(d.method!=='親餵'?(parseFloat(d.amount)||0):0);},0);
      return ml?ml+'ml':'—';
    }
    case 'breastMin': {
      var mn=of('feed').reduce(function(a,r){var d=parseData(r);
        return a+(d.method==='親餵'?(parseFloat(d.amount)||0):0);},0);
      return mn?mn+'分':'—';
    }
    case 'lastFeed': { var l=lastOf('feed'); return l?agoShort(Date.now()-new Date(l.startAt)):'—'; }
    case 'solidCount': return of('solid').length;
    case 'poopCount': return of('poop').length;
    case 'lastPoop': { var p=lastOf('poop'); return p?agoShort(Date.now()-new Date(p.startAt)):'—'; }
    case 'medCount': return of('med').length;
    case 'lastMed': { var md=lastOf('med'); return md?agoShort(Date.now()-new Date(md.startAt)):'—'; }
    case 'lastFever': {
      var fv=kidRecords().filter(function(r){return r.type==='temp'&&isFever(r);})[0];
      if(!fv) return '無';
      var ms=Date.now()-new Date(fv.startAt);
      if(ms>48*3600000) return '無';          /* 超過兩天就顯示無 */
      return agoShort(ms);
    }
    case 'tempMax': {
      var vs=of('temp').map(function(r){return parseFloat(parseData(r).value)||0;}).filter(Boolean);
      return vs.length?Math.max.apply(null,vs).toFixed(1)+'°':'—';
    }
  }
  return '—';
}

/* 左右滑動切換日期（只在「今日」分頁的時間軸區域） */
function shiftDay(n){
  var d=new Date(S.day+'T12:00:00');
  d.setDate(d.getDate()+n);
  var today=new Date(); today.setHours(23,59,59,999);
  if(d>today){ toast('已經是今天了'); return false; }
  S.day=dkey(d); render(); return true;
}
function enableSwipe(node,animate){
  var x0=null,y0=null,lock=null;
  node.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; lock=null;
  },{passive:true});
  node.addEventListener('touchmove',function(e){
    if(x0==null) return;
    var dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(lock===null && (Math.abs(dx)>10||Math.abs(dy)>10)){
      lock = Math.abs(dx)>Math.abs(dy)*1.4 ? 'x' : 'y';
    }
    if(lock==='x' && animate!==false){
      node.style.transform='translateX('+Math.max(-60,Math.min(60,dx*0.3))+'px)';
      node.style.opacity=String(1-Math.min(0.25,Math.abs(dx)/600));
    }
  },{passive:true});
  node.addEventListener('touchend',function(e){
    if(animate!==false){ node.style.transform=''; node.style.opacity=''; }
    if(x0==null||lock!=='x'){ x0=null; return; }
    var dx=(e.changedTouches[0].clientX)-x0;
    x0=null;
    if(Math.abs(dx)<55) return;
    if(e._blSwiped) return;      /* 內層已處理過，外層不再重複換日 */
    e._blSwiped=true;
    shiftDay(dx<0?1:-1);
  },{passive:true});
}

/* 疫苗提醒：接種日前一個月開始提醒；已逾期的只回看 60 天，避免舊資料灌爆首頁 */
function vaccineDue(){
  var k=kid(); if(!k) return null;
  var done={};
  kidRecords().forEach(function(r){
    if(r.type!=='vaccine') return;
    var n=parseData(r).name;
    if(n) done[vacName(n)]=true;
  });
  var today=new Date(); today.setHours(0,0,0,0);
  var soon=[], late=[];
  VACCINES.forEach(function(v){
    if(done[v.n]) return;
    var dt=new Date(k.birthdate);
    dt.setMonth(dt.getMonth()+v.m);
    dt.setHours(0,0,0,0);
    var days=Math.round((dt-today)/86400000);
    if(days>=0 && days<=30) soon.push({v:v,date:dt,days:days});
    else if(days<0 && days>=-60) late.push({v:v,date:dt,days:days});
  });
  if(!soon.length && !late.length) return null;
  soon.sort(function(a,b){return a.days-b.days;});
  late.sort(function(a,b){return b.days-a.days;});
  return {soon:soon, late:late};
}

/* 大便提醒：超過 3 天沒有紀錄就在首頁提示 */
function poopDue(){
  var recs=kidRecords().filter(function(r){return r.type==='poop';});
  if(!recs.length) return null;              /* 完全沒記過就不吵 */
  var last=recs[0];
  var ms=Date.now()-new Date(last.startAt);
  var days=Math.floor(ms/86400000);
  if(days<3) return null;
  return {days:days, at:last.startAt, hours:Math.floor(ms/3600000)};
}

/* 牙醫回診提醒：只認「最近一次看牙」所填的下次回診日期。
   再看一次牙就會被新的取代；最新那次沒填下次日期＝目前沒有預約。 */
function dentalDue(){
  var recs=kidRecords().filter(function(r){return r.type==='dental';});
  if(!recs.length) return null;
  var latest=recs[0];   /* kidRecords 已由新到舊排序 */
  var n=parseData(latest).next;
  if(!n) return null;
  var dt=new Date(n+'T12:00:00');
  if(isNaN(dt)) return null;
  var today=new Date(); today.setHours(0,0,0,0);
  var days=Math.round((dt-today)/86400000);
  if(days>30) return null;    /* 一個月內才提醒 */
  if(days<-30) return null;   /* 過期太久就不再吵 */
  return {date:dt, rec:latest, raw:n, days:days};
}

   9. 成長
   ============================================================ */
var METRICS=[{k:'weight',lb:'體重',u:'kg'},{k:'height',lb:'身高',u:'cm'},{k:'head',lb:'頭圍',u:'cm'}];
var gMetric='weight';

function growthPoints(metric){
  var k=kid(); if(!k) return [];
  return kidRecords().filter(function(r){return r.type==='growth';})
    .map(function(r){ var d=parseData(r); return {m:ageMonths(k.birthdate,r.startAt), v:parseFloat(d[metric]), at:r.startAt, rec:r}; })
    .filter(function(p){return !isNaN(p.v)&&p.v>0;})
    .sort(function(a,b){return a.m-b.m;});
}
function chartSvg(metric){
  var k=kid(), sex=(k.sex==='girl')?'girl':'boy';
  var tbl=GROWTH[sex][metric];
  var pts=growthPoints(metric);
  var nowM=ageMonths(k.birthdate);
  var maxM=Math.min(60,Math.max(6,Math.ceil((Math.max(nowM,pts.length?pts[pts.length-1].m:0)+2)/6)*6));
  var W=320,H=210,L=32,R=8,T=8,B=22;
  var lo=1e9,hi=-1e9;
  for(var m=0;m<=maxM;m+=1){ var r=interpRow(tbl,m); lo=Math.min(lo,r[0]); hi=Math.max(hi,r[4]); }
  pts.forEach(function(p){ lo=Math.min(lo,p.v); hi=Math.max(hi,p.v); });
  var padv=(hi-lo)*0.06; lo-=padv; hi+=padv;
  function X(m){ return L+(m/maxM)*(W-L-R); }
  function Y(v){ return T+(1-(v-lo)/(hi-lo))*(H-T-B); }
  function path(idx){
    var s='';
    for(var m=0;m<=maxM;m+=0.5){ var r=interpRow(tbl,m); s+=(m?'L':'M')+X(m).toFixed(1)+' '+Y(r[idx]).toFixed(1); }
    return s;
  }
  function area(a,b){
    var s='';
    for(var m=0;m<=maxM;m+=0.5){ var r=interpRow(tbl,m); s+=(m?'L':'M')+X(m).toFixed(1)+' '+Y(r[a]).toFixed(1); }
    for(var m2=maxM;m2>=0;m2-=0.5){ var r2=interpRow(tbl,m2); s+='L'+X(m2).toFixed(1)+' '+Y(r2[b]).toFixed(1); }
    return s+'Z';
  }
  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  g+='<path d="'+area(0,4)+'" fill="#FFC4C4" opacity=".25"/>';
  g+='<path d="'+area(1,3)+'" fill="#FFC4C4" opacity=".38"/>';
  [0,1,3,4].forEach(function(i){ g+='<path d="'+path(i)+'" fill="none" stroke="#EE6983" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 3"/>'; });
  g+='<path d="'+path(2)+'" fill="none" stroke="#EE6983" stroke-width="1.6"/>';
  /* y 軸刻度 */
  for(var i=0;i<=4;i++){
    var v=lo+(hi-lo)*i/4, y=Y(v);
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#F0E3DA" stroke-width="1"/>';
    g+='<text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#9A8189">'+v.toFixed(metric==='weight'?1:0)+'</text>';
  }
  var step=maxM<=12?3:maxM<=24?6:12;
  for(var m3=0;m3<=maxM;m3+=step){
    g+='<text x="'+X(m3).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8.5" fill="#9A8189">'+m3+'m</text>';
  }
  /* 寶寶的線 */
  if(pts.length){
    var dpath=pts.map(function(p,i){return (i?'L':'M')+X(Math.min(p.m,maxM)).toFixed(1)+' '+Y(p.v).toFixed(1);}).join('');
    g+='<path d="'+dpath+'" fill="none" stroke="#850E35" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p,i){
      var last=i===pts.length-1;
      g+='<circle cx="'+X(Math.min(p.m,maxM)).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="#850E35" stroke="#fff" stroke-width="1.6"/>';
    });
  }
  return g+'</svg>';
}

/* 發燒門檻：耳溫／肛溫 38.0；額溫／腋溫較低，用 37.5 */
function feverLimit(spot){
  return (spot==='額溫'||spot==='腋溫') ? 37.5 : 38.0;
}
function isFever(r){
  var d=parseData(r), v=parseFloat(d.value);
  return !isNaN(v) && v>=feverLimit(d.spot);
}
function tempPoints(){
  return kidRecords().filter(function(r){return r.type==='temp';})
    .map(function(r){ var d=parseData(r);
      return {v:parseFloat(d.value), at:r.startAt, spot:d.spot||'', rec:r, fever:isFever(r)};
    })
    .filter(function(p){ return !isNaN(p.v)&&p.v>0; });
}

function tempChart(pts){
  var W=320,H=190,L=30,R=8,T=12,B=24;
  var plot=H-T-B, pw=W-L-R;
  var vals=pts.map(function(p){return p.v;});
  var lo=Math.min(36, Math.min.apply(null,vals)-0.3);
  var hi=Math.max(39, Math.max.apply(null,vals)+0.3);
  var t0=new Date(pts[0].at).getTime();
  var t1=new Date(pts[pts.length-1].at).getTime();
  var span=Math.max(1,t1-t0);
  function X(at){ return pts.length===1 ? L+pw/2 : L+((new Date(at)-t0)/span)*pw; }
  function Y(v){ return T+(1-(v-lo)/(hi-lo))*plot; }

  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  /* 發燒區間底色 */
  var y38=Y(38);
  g+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+Math.max(0,y38-T).toFixed(1)+
    '" fill="#D2523F" opacity=".08"/>';
  /* 橫格線 */
  for(var v=Math.ceil(lo*2)/2; v<=hi; v+=0.5){
    var y=Y(v);
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+
      '" stroke="#F0E3DA" stroke-width="1"/>';
    if(Math.abs(v*10%10)<0.01||v===38){
      g+='<text x="'+(L-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#9A8189">'+
        v.toFixed(0)+'</text>';
    }
  }
  /* 38 度發燒線 */
  g+='<line x1="'+L+'" y1="'+y38.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y38.toFixed(1)+
    '" stroke="#D2523F" stroke-width="1.2" stroke-dasharray="4 3"/>';
  /* 折線 */
  if(pts.length>1){
    var dpath=pts.map(function(p,i){return (i?'L':'M')+X(p.at).toFixed(1)+' '+Y(p.v).toFixed(1);}).join('');
    g+='<path d="'+dpath+'" fill="none" stroke="#850E35" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p){
    g+='<circle cx="'+X(p.at).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(p.fever?4:3)+
      '" fill="'+(p.fever?'#D2523F':'#850E35')+'" stroke="#fff" stroke-width="1.5"/>';
  });
  /* 時間軸標籤 */
  var marks = pts.length===1 ? [0] : [0, Math.floor((pts.length-1)/2), pts.length-1];
  marks.forEach(function(i){
    var d=new Date(pts[i].at);
    g+='<text x="'+X(pts[i].at).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="8" fill="#9A8189">'+
      (d.getMonth()+1)+'/'+d.getDate()+'</text>';
  });
  return g+'</svg>';
}

var statRange=7;
var hourMetric='all';
function viewStats(root){
  var pr=el('div','pillRow');
  [[7,'近 7 天'],[14,'近 14 天'],[30,'近 30 天']].forEach(function(o){
    var b=el('button','pill'+(statRange===o[0]?' on':''),o[1]);
    b.onclick=function(){ statRange=o[0]; S.keepScroll=true; render(); };
    pr.appendChild(b);
  });
  root.appendChild(pr);

  var days=[];
  for(var i=statRange-1;i>=0;i--){
    var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push({d:d,key:dkey(d),sleep:0,naps:0,feed:0,ml:0,solid:0,poop:0,med:0,temp:0,all:0});
  }
  var byKey={}; days.forEach(function(x){byKey[x.key]=x;});
  kidRecords().forEach(function(r){
    var d=parseData(r);
    if(r.type==='sleep'){
      var s=new Date(r.startAt), e=r.endAt?new Date(r.endAt):new Date();
      days.forEach(function(x){
        var a=Math.max(s,x.d), b=Math.min(e,new Date(x.d.getTime()+86400000));
        if(b>a) x.sleep+=(b-a)/3600000;
      });
      var xs=byKey[dkey(new Date(r.startAt))];
      if(xs){ xs.naps++; xs.all++; }
      return;
    }
    var x=byKey[dkey(new Date(r.startAt))]; if(!x) return;
    x.all++;
    if(r.type==='feed'){ x.feed++; if(d.method!=='親餵') x.ml+=parseFloat(d.amount)||0; }
    if(r.type==='poop') x.poop++;
    if(r.type==='solid') x.solid++;
    if(r.type==='med') x.med++;
    if(r.type==='temp'){ var tv=parseFloat(d.value)||0; if(tv>x.temp) x.temp=tv; }
  });

  var nDays=days.length;
  function avgOf(f){ return days.reduce(function(a,x){return a+(x[f]||0);},0)/nDays; }
  function sumOf(f){ return days.reduce(function(a,x){return a+(x[f]||0);},0); }
  function maxOf(f){ return Math.max.apply(null,days.map(function(x){return x[f]||0;})); }
  function daysWith(f){ return days.filter(function(x){return (x[f]||0)>0;}).length; }

  /* 摘要數字：跟著上面的類型切換 */
  var tiles;
  if(hourMetric==='sleep'){
    tiles=[[avgOf('sleep').toFixed(1)+'h','平均睡眠'],[avgOf('naps').toFixed(1),'平均次數'],
           [maxOf('sleep').toFixed(1)+'h','最長一天'],[sumOf('naps'),'總次數']];
  }else if(hourMetric==='feed'){
    var am=avgOf('ml');
    tiles=[[avgOf('feed').toFixed(1),'平均次數'],[am?Math.round(am)+'ml':'—','平均奶量'],
           [sumOf('feed'),'總次數'],[sumOf('ml')?Math.round(sumOf('ml'))+'ml':'—','總奶量']];
  }else if(hourMetric==='temp'){
    var tvals=days.map(function(x){return x.temp;}).filter(Boolean);
    var fevCount=kidRecords().filter(function(r){
      return r.type==='temp' && isFever(r) && new Date(r.startAt)>=days[0].d;
    }).length;
    tiles=[[tvals.length?Math.max.apply(null,tvals).toFixed(1)+'°':'—','最高'],
           [tvals.length?(tvals.reduce(function(a,b){return a+b;},0)/tvals.length).toFixed(1)+'°':'—','平均'],
           [tvals.length,'量測天數'],[fevCount,'發燒次數']];
  }else if(hourMetric==='all'){
    tiles=[[sumOf('all'),'總筆數'],[avgOf('all').toFixed(1),'平均每天'],
           [avgOf('sleep').toFixed(1)+'h','平均睡眠'],
           [daysWith('all')+'/'+nDays,'有紀錄天數']];
  }else{
    tiles=[[avgOf(hourMetric).toFixed(1),'平均次數'],[sumOf(hourMetric),'總次數'],
           [maxOf(hourMetric),'最多一天'],[daysWith(hourMetric)+'/'+nDays,'有紀錄天數']];
  }
  var sg=el('div','dayStats');
  tiles.forEach(function(t){
    sg.appendChild(el('div','st','<div class="v">'+t[0]+'</div><div class="l">'+t[1]+'</div>'));
  });
  fitRows(sg,tiles.length);
  root.appendChild(sg);

  /* ---- 作息時間軸 ---- */
  root.appendChild(el('div','secTitle','作息時間軸'));
  var hourTypes=PREFS.types.filter(function(k){return STAT_TYPES[k];});
  if(!hourTypes.length) hourTypes=['all'];
  if(hourTypes.indexOf(hourMetric)<0) hourMetric=hourTypes[0];
  var hpr=el('div','pillRow');
  hourTypes.forEach(function(k){
    var b=el('button','pill'+(hourMetric===k?' on':''),STAT_TYPES[k].em+' '+STAT_TYPES[k].lb);
    b.onclick=function(){ hourMetric=k; S.keepScroll=true; render(); };
    hpr.appendChild(b);
  });
  root.appendChild(hpr);

  /* 每天一欄、縱軸 0–24 點，看得出每天發生的實際時間 */
  var GW=320, GH=Math.min(300, Math.max(190, days.length>14?260:220));
  var GL=22, GR=6, GT=8, GB=20;
  var gw=GW-GL-GR, gh=GH-GT-GB;
  var nD=days.length;
  var colW=gw/nD;
  function GX(i){ return GL+i*colW; }
  function GY(h){ return GT+(h/24)*gh; }

  var gg='<svg class="chart" viewBox="0 0 '+GW+' '+GH+'" preserveAspectRatio="none" style="height:'+GH+'px">';
  /* 夜間底色 22:00–06:00 */
  gg+='<rect x="'+GL+'" y="'+GY(0)+'" width="'+gw+'" height="'+(GY(6)-GY(0)).toFixed(1)+'" fill="#7C6BB0" opacity=".06"/>';
  gg+='<rect x="'+GL+'" y="'+GY(22)+'" width="'+gw+'" height="'+(GY(24)-GY(22)).toFixed(1)+'" fill="#7C6BB0" opacity=".06"/>';
  /* 隔欄淡底 */
  days.forEach(function(x,i){
    if(i%2) gg+='<rect x="'+GX(i).toFixed(1)+'" y="'+GT+'" width="'+colW.toFixed(2)+'" height="'+gh+'" fill="#FCF5EE"/>';
  });
  /* 橫線 + 時間標籤 */
  [0,3,6,9,12,15,18,21,24].forEach(function(hh){
    var y=GY(hh);
    gg+='<line x1="'+GL+'" y1="'+y.toFixed(1)+'" x2="'+(GW-GR)+'" y2="'+y.toFixed(1)+
      '" stroke="#F0E3DA" stroke-width="'+(hh%6?0.6:1)+'"/>';
    if(hh%6===0) gg+='<text x="'+(GL-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#9A8189">'+hh+'</text>';
  });

  var dayStart={};
  days.forEach(function(x,i){ dayStart[x.key]=i; });
  var count=0;

  var showAllTypes = hourMetric==='all';
  /* 「全部」只畫使用者在設定裡保留的類別 */
  var picked=PREFS.types.filter(function(k){return STAT_TYPES[k] && k!=='all';});
  var dotTypes = showAllTypes ? picked.filter(function(k){return k!=='sleep';}) : [hourMetric];

  /* 睡眠畫成長條，跨夜自動切成兩段接在隔天頂端 */
  if(hourMetric==='sleep' || (showAllTypes && picked.indexOf('sleep')>=0)){
    kidRecords().filter(function(r){return r.type==='sleep';}).forEach(function(r){
      var s0=new Date(r.startAt), e0=r.endAt?new Date(r.endAt):new Date();
      var cur=new Date(s0);
      while(cur<e0){
        var mid=new Date(cur); mid.setHours(24,0,0,0);
        var segEnd=new Date(Math.min(mid,e0));
        var i=dayStart[dkey(cur)];
        if(i!=null){
          var h1=cur.getHours()+cur.getMinutes()/60;
          var h2=segEnd.getTime()===mid.getTime()?24:(segEnd.getHours()+segEnd.getMinutes()/60);
          var y1=GY(h1), y2=GY(h2);
          /* 顯示全部時睡眠退成底層寬帶，讓其他事件疊在上面 */
          var pad = showAllTypes ? 0.06 : 0.18;
          gg+='<rect x="'+(GX(i)+colW*pad).toFixed(2)+'" y="'+y1.toFixed(1)+
            '" width="'+(colW*(1-pad*2)).toFixed(2)+'" height="'+Math.max(1.5,y2-y1).toFixed(1)+
            '" rx="'+Math.min(2.5,colW*0.3).toFixed(1)+'" fill="#7C6BB0" opacity="'+(showAllTypes?'.32':'.85')+'"/>';
          count++;
        }
        cur=new Date(mid);
      }
    });
  }

  if(hourMetric!=='sleep'){
    var COLS={feed:'#EE6983',poop:'#A9784B',solid:'#E0913C',med:'#4C9AA8',
              temp:'#D2523F',dental:'#4F7FBF',vaccine:'#8A6FBF',growth:'#5B8C5A'};
    kidRecords().filter(function(r){return dotTypes.indexOf(r.type)>=0;}).forEach(function(r){
      var t=new Date(r.startAt);
      var i=dayStart[dkey(t)];
      if(i==null) return;
      var y=GY(t.getHours()+t.getMinutes()/60);
      var sz=Math.max(3.5,Math.min(7,colW*0.45));
      gg+='<rect x="'+(GX(i)+colW/2-sz/2).toFixed(2)+'" y="'+(y-sz/2).toFixed(2)+
        '" width="'+sz.toFixed(1)+'" height="'+sz.toFixed(1)+'" rx="1.5" fill="'+(COLS[r.type]||'#850E35')+
        '" stroke="#fff" stroke-width="'+(showAllTypes?0.8:0)+'"/>';
      count++;
    });
  }

  /* 日期標籤 */
  var everyD=Math.ceil(nD/5);
  days.forEach(function(x,i){
    if(i%everyD===0 || i===nD-1){
      gg+='<text x="'+(GX(i)+colW/2).toFixed(1)+'" y="'+(GH-6)+
        '" text-anchor="middle" font-size="7.5" fill="#9A8189">'+(x.d.getMonth()+1)+'/'+x.d.getDate()+'</text>';
    }
  });
  gg+='</svg>';

  var hc=el('div','card');
  var hbox=el('div',null,gg);
  hbox.style.cssText='width:100%;overflow:hidden';
  hc.appendChild(hbox);
  if(count && showAllTypes && picked.length>1){
    var LEGC={sleep:'#7C6BB0',feed:'#EE6983',solid:'#E0913C',poop:'#A9784B',
              med:'#4C9AA8',temp:'#D2523F'};
    var lgd=el('div','legend');
    lgd.innerHTML=picked.map(function(k){
      return '<span><i style="background:'+(LEGC[k]||'#850E35')+'"></i>'+STAT_TYPES[k].lb+'</span>';
    }).join('');
    hc.appendChild(lgd);
  }
  hc.appendChild(el('div','bandNote',
    count ? '直軸是一天 24 小時（0 在最上、24 在最下），每一欄是一天。淺紫色為夜間 22:00–06:00。'
          : '這段期間沒有紀錄。'));
  root.appendChild(hc);

  function bars(field,fmt,unit,title){
    root.appendChild(el('div','secTitle',title));
    var c=el('div','card');
    var n=days.length;
    var max=Math.max.apply(null,days.map(function(x){return x[field]||0;}))||1;
    var W=320, H=n>20?96:112, T=14, B=18;
    var plot=H-T-B;
    var gap=n>20?1.5:n>10?3:5;
    var bw=(W-gap*(n-1))/n;
    var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
    g+='<line x1="0" y1="'+(T+plot)+'" x2="'+W+'" y2="'+(T+plot)+'" stroke="#F0E3DA" stroke-width="1"/>';
    var labelEvery=Math.ceil(n/6);
    days.forEach(function(x,i){
      var v=x[field]||0;
      var h=v>0?Math.max(2.5,(v/max)*plot):1.5;
      var xx=i*(bw+gap), yy=T+plot-h;
      g+='<rect x="'+xx.toFixed(2)+'" y="'+yy.toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+h.toFixed(2)+
        '" rx="'+Math.min(3,bw/2).toFixed(1)+'" fill="'+(v>0?'url(#bg1)':'#F0E3DA')+'"/>';
      if(n<=14 && v>0){
        g+='<text x="'+(xx+bw/2).toFixed(2)+'" y="'+(yy-3.5).toFixed(2)+
          '" text-anchor="middle" font-size="8" font-weight="700" fill="#850E35">'+fmt(v)+'</text>';
      }
      if(i%labelEvery===0 || i===n-1){
        g+='<text x="'+(xx+bw/2).toFixed(2)+'" y="'+(H-5)+
          '" text-anchor="middle" font-size="8" fill="#9A8189">'+(x.d.getMonth()+1)+'/'+x.d.getDate()+'</text>';
      }
    });
    g+='<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#EE6983"/><stop offset="1" stop-color="#850E35"/>'+
      '</linearGradient></defs></svg>';
    var box=el('div',null,g);
    box.style.cssText='width:100%;overflow:hidden';
    c.appendChild(box);
    var withData=days.map(function(x){return x[field]||0;}).filter(function(v){return v>0;});
    var sm=el('div','bandNote');
    sm.textContent = withData.length
      ? '最高 '+fmt(Math.max.apply(null,withData))+'　最低 '+fmt(Math.min.apply(null,withData))+
        '　有紀錄 '+withData.length+'/'+n+' 天'
      : '這段期間沒有紀錄';
    c.appendChild(sm);
    if(unit) c.appendChild(el('div','bandNote',unit));
    root.appendChild(c);
  }

  var BARDEF={
    all:   {lb:'每日紀錄筆數',   f:'all',   fmt:function(v){return v;}},
    sleep: {lb:'每日睡眠總時數', f:'sleep', fmt:function(v){return v.toFixed(1);},
            unit:'單位：小時（跨夜睡眠會依實際落在哪一天分攤）'},
    feed:  {lb:'每日餵奶次數',   f:'feed',  fmt:function(v){return v;}},
    solid: {lb:'每日副食品次數', f:'solid', fmt:function(v){return v;}},
    poop:  {lb:'每日大便次數',   f:'poop',  fmt:function(v){return v;}},
    med:   {lb:'每日用藥次數',   f:'med',   fmt:function(v){return v;}},
    temp:  {lb:'每日最高體溫',   f:'temp',  fmt:function(v){return v.toFixed(1);},
            unit:'只計入有量測的日子'}
  };
  var bdef=BARDEF[hourMetric]||BARDEF.all;
  bars(bdef.f, bdef.fmt, bdef.unit||'', bdef.lb);

  /* 用藥與體溫摘要 */
  var since=new Date(); since.setDate(since.getDate()-statRange);
  var meds=kidRecords().filter(function(r){return r.type==='med' && new Date(r.startAt)>=since;});
  var temps=kidRecords().filter(function(r){return r.type==='temp' && new Date(r.startAt)>=since;});
  if(temps.length){
    root.appendChild(el('div','secTitle','體溫'));
    var tc=el('div','card');
    var vals=temps.map(function(r){return parseFloat(parseData(r).value)||0;}).filter(Boolean);
    var mx=Math.max.apply(null,vals);
    tc.innerHTML='<div style="display:flex;justify-content:space-between">'+
      '<div><div style="font-size:11.5px;color:var(--mute)">最高</div><div style="font-size:20px;font-weight:900;color:'+(mx>=38?'#D2523F':'var(--wine)')+'">'+mx.toFixed(1)+'°C</div></div>'+
      '<div><div style="font-size:11.5px;color:var(--mute)">平均</div><div style="font-size:20px;font-weight:900">'+(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1)+'°C</div></div>'+
      '<div><div style="font-size:11.5px;color:var(--mute)">量測次數</div><div style="font-size:20px;font-weight:900">'+vals.length+'</div></div></div>';
    root.appendChild(tc);
  }
  if(meds.length){
    root.appendChild(el('div','secTitle','用藥'));
    var mc=el('div','card');
    var group={};
    meds.forEach(function(r){
      var d=parseData(r);
      var words=(r.note||'').split(/\s+/).filter(Boolean);
      if(!words.length && d.name) words=[d.name];
      if(!words.length) words=['未填內容'];
      words.forEach(function(w){ group[w]=(group[w]||0)+1; });
    });
    var keys=Object.keys(group).sort(function(a,b){return group[b]-group[a];});
    var hd=el('div','bandNote','共 '+meds.length+' 次用藥，依備註中的項目分別統計：');
    hd.style.margin='0 0 6px'; mc.appendChild(hd);
    keys.forEach(function(n,i){
      var row=el('div',null,'<span>'+esc(n)+'</span><span class="tag">'+group[n]+' 次</span>');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)';
      mc.appendChild(row);
    });
    root.appendChild(mc);
  }
}

/* ============================================================
   12. 交接留言板（支援多筆回覆、未讀數字）
   ============================================================ */
/* 回覆是把 [re:對方留言id] 存在文字最前面，不用改後端欄位 */
function parseMsg(m){
  var t=String(m.text||'');
  var mt=t.match(/^\[re:([^\]]+)\]\s*/);
  return { parentId: mt?mt[1]:null, text: mt?t.slice(mt[0].length):t };
}
function msgMap(){
  var mp={}; S.handoff.forEach(function(m){ mp[m.id]=m; }); return mp;
}
function rootOf(m,mp){
  var cur=m, guard=0;
  while(guard++<50){
    var p=parseMsg(cur).parentId;
    if(!p || !mp[p]) return cur;
    cur=mp[p];
  }
  return cur;
}
function unreadCount(){
  var since=localStorage.getItem('bl_handoffRead')||'1970-01-01T00:00:00.000Z';
  return S.handoff.filter(function(m){
    return m.by!==CFG.who && new Date(m.at)>new Date(since);
  }).length;
}
function markHandoffRead(){
  localStorage.setItem('bl_handoffRead',new Date().toISOString());
}

function viewHandoff(root){
  markHandoffRead();
  var mp=msgMap();
  var st={photoId:null,dataUrl:null};
  var target=S.replyTo && mp[S.replyTo] ? mp[S.replyTo] : null;
  if(S.replyTo && !target) S.replyTo=null;

  var c=el('div','card');

  if(target){
    var bar=el('div','replyBar');
    var tp=parseMsg(target);
    bar.innerHTML='<div class="txt">回覆 <b>'+esc(target.by||'某人')+'</b>：'+esc(tp.text.slice(0,40))+'</div>';
    var xb=el('button',null,'✕');
    xb.onclick=function(){ S.replyTo=null; render(); };
    bar.appendChild(xb);
    c.appendChild(bar);
  }

  var ta=el('textarea','in');
  ta.rows=1;
  ta.placeholder=target?('回覆 '+(target.by||'某人')+'…')
    :'留給爸媽或保母的話…';
  c.appendChild(field(target?'回覆':'新留言',ta));
  autoGrow(ta);
  c.appendChild(photoField(st));
  var send=el('button','btn',target?'送出回覆':'送出留言');
  send.onclick=function(){
    if(!ta.value.trim()){ toast('先寫點什麼吧'); return; }
    send.disabled=true; send.textContent='送出中…';
    var body=(S.replyTo?'[re:'+S.replyTo+'] ':'')+ta.value;
    uploadIfNeeded(st).then(function(pid){
      return push('handoff',{id:uuid(),at:new Date().toISOString(),by:CFG.who,text:body,photoId:pid||'',deleted:''});
    }).then(function(saved){
      S.handoff.push(saved); S.replyTo=null; markHandoffRead(); render(); toast('已送出');
    }).catch(function(){ send.disabled=false; send.textContent='再試一次'; });
  };
  c.appendChild(send);
  root.appendChild(c);

  if(!S.handoff.length){
    root.appendChild(el('div','empty','<span class="big">💬</span>還沒有留言。<br>交接事項寫在這裡，大家都看得到。'));
    return;
  }

  /* 依主留言分組：主留言由新到舊，底下的回覆由舊到新照順序排 */
  var roots=[], kids={};
  S.handoff.forEach(function(m){
    var r=rootOf(m,mp);
    if(r.id===m.id) roots.push(m);
    else (kids[r.id]=kids[r.id]||[]).push(m);
  });
  roots.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
  Object.keys(kids).forEach(function(k){
    kids[k].sort(function(a,b){return new Date(a.at)-new Date(b.at);});
  });

  function bubble(m,isReply){
    var p=parseMsg(m);
    var w=el('div','msg'+(m.by===CFG.who?' mine':'')+(isReply?' reply':''));
    var d=new Date(m.at);
    var head='<div class="mh"><span>'+esc(m.by||'某人')+'</span><span>'+
      (d.getMonth()+1)+'/'+d.getDate()+' '+hhmm(m.at)+'</span></div>';
    var quote='';
    if(isReply && p.parentId && mp[p.parentId]){
      var par=mp[p.parentId], pp=parseMsg(par);
      quote='<div class="quote">回覆 <b>'+esc(par.by||'某人')+'</b>：'+
        esc(pp.text.slice(0,50))+(pp.text.length>50?'…':'')+'</div>';
    }
    w.innerHTML=head+quote+'<div class="mb">'+esc(p.text)+'</div>';
    if(m.photoId){
      var im=el('img'); im.style.cssText='width:100%;border-radius:11px;margin-top:8px';
      photoUrl(m.photoId,im);
      im.onclick=function(){ $('#lbImg').src=im.src; $('#lightbox').classList.add('on'); };
      w.appendChild(im);
    }
    var acts=el('div','acts');
    var rep=el('button','rep','↩ 回覆');
    rep.onclick=function(){ S.replyTo=m.id; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    acts.appendChild(rep);
    if(m.by===CFG.who){
      var del=el('button',null,'刪除');
      del.onclick=function(){
        if(!confirm('刪除這則留言？'+((kids[m.id]||[]).length?'（底下的回覆會保留）':'')))return;
        removeItem('handoff',m.id).then(function(){
          S.handoff=S.handoff.filter(function(x){return x.id!==m.id;}); render();
        });
      };
      acts.appendChild(del);
    }
    w.appendChild(acts);
    return w;
  }

  root.appendChild(el('div','secTitle','留言'));
  roots.forEach(function(m){
    root.appendChild(bubble(m,false));
    (kids[m.id]||[]).forEach(function(r){ root.appendChild(bubble(r,true)); });
  });
}

/* ============================================================
   13. 主渲染 + 啟動
   ============================================================ */
function render(){
  var k=kid();
  if(k){
    $('#kidAv').textContent=k.name.slice(0,1);
    $('#kidNm').textContent=k.name;
    $('#kidAg').textContent=ageText(k.birthdate);
  }else{
    $('#kidAv').textContent='＋'; $('#kidNm').textContent='尚未新增寶寶'; $('#kidAg').textContent='點這裡新增';
  }
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.classList.toggle('on',b.dataset.tab===S.tab);
    var old=b.querySelector('.badge-dot');
    if(old) old.remove();
    if(b.dataset.tab==='handoff'){
      var n=unreadCount();
      if(n>0 && S.tab!=='handoff'){
        b.appendChild(el('span','badge-dot',n>99?'99+':String(n)));
      }
    }
  });
  var root=$('#main'); root.innerHTML='';
  if(!k){
    root.appendChild(el('div','empty','<span class="big">🍼</span>先新增一位寶寶，就可以開始記錄了。'));
    var b=el('button','btn','＋ 新增寶寶'); b.onclick=function(){openChildForm();};
    root.appendChild(b);
    return;
  }
  if(S.tab==='today') viewToday(root);
  else if(S.tab==='growth') viewGrowth(root);
  else if(S.tab==='vaccine') viewCare(root);
  else if(S.tab==='stats') viewStats(root);
  else if(S.tab==='handoff') viewHandoff(root);
  if(S.keepScroll){ S.keepScroll=false; }
  else window.scrollTo(0,0);
}

document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){
    if(b.dataset.tab!=='handoff') S.replyTo=null;
    S.tab=b.dataset.tab;
    if(S.tab==='today') S.day=dkey(new Date());
    render();
  };
});

$('#kidBtn').onclick=function(){ S.children.length?openKidPicker():openChildForm(); };
$('#searchBtn').onclick=openSearch;
$('#menuBtn').onclick=openMenu;
$('#syncBtn').onclick=function(){ pull().then(function(){toast('已更新');}); };

function showApp(){
  $('#setup').classList.remove('on');
  ['#top','#main','#tabs','#fab'].forEach(function(s){$(s).classList.remove('hide');});
  pull();
}
$('#suGo').onclick=function(){
  var u=$('#suUrl').value.trim(), s=$('#suSecret').value.trim(), w=$('#suWho').value.trim();
  if(!u||!s||!w){ $('#suMsg').textContent='三個欄位都要填喔'; return; }
  $('#suMsg').textContent='連線中…';
  CFG.url=u; CFG.secret=s; CFG.who=w;
  api({action:'ping'}).then(function(){
    localStorage.setItem('bl_url',u); localStorage.setItem('bl_secret',s); localStorage.setItem('bl_who',w);
    $('#suMsg').textContent=''; showApp();
  }).catch(function(e){ $('#suMsg').textContent='連不上：'+e.message; });
};

if(CFG.url && CFG.secret){ showApp(); }
else { $('#setup').classList.add('on'); }

/* 回到前景時自動同步 */
document.addEventListener('visibilitychange',function(){
  if(!document.hidden && CFG.url) pull(true);
});
setInterval(function(){ if(!document.hidden && CFG.url && S.loaded) pull(true); },90000);
</script>
</body>
</html>
